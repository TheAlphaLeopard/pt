<!DOCTYPE html>
<html>
<head>
  <title>AI Agent Chat</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #chat { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; }
    input { width: 80%; padding: 10px; }
    button { padding: 10px; }
  </style>
</head>
<body>
  <h1>Free AI Agent</h1>
  <div id="chat"></div>
  <input id="input" type="text" placeholder="Type your message">
  <button onclick="sendMessage()">Send</button>
  <script type="module">
    import Client from 'https://g4f.dev/dist/js/client.js';

    const client = new Client();

    window.sendMessage = async function() {
      const input = document.getElementById('input');
      const chat = document.getElementById('chat');
      const prompt = input.value;
      if (!prompt) return;
      chat.innerHTML += '<p><strong>You:</strong> ' + prompt + '</p>';
      input.value = '';
      try {
        const result = await client.chat.completions.create({
          model: 'gpt-4o-mini',
          messages: [{ role: 'user', content: prompt }]
        });
        chat.innerHTML += '<p><strong>AI:</strong> ' + result.choices[0].message.content + '</p>';
      } catch (error) {
        chat.innerHTML += '<p><strong>Error:</strong> ' + error.message + '</p>';
      }
      chat.scrollTop = chat.scrollHeight;
    };
  </script>
</body>
</html>
